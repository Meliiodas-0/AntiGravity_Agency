name: Keep Supabase Alive

# Free-tier Supabase pauses a project after ~7 days of inactivity.
# This pings the REST API every 3 days so the Studs Agency project never sleeps.
# The key below is the PUBLIC anon key (already shipped in the site's JS) — safe to commit.

on:
  schedule:
    - cron: "0 7 */3 * *" # every 3 days at 07:00 UTC
  workflow_dispatch: {} # allow manual runs from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFuYmhndmdreHdvZmRtYmhldmJsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA2NTQwNzgsImV4cCI6MjA4NjIzMDA3OH0.ebvCfSYts5DJEa7THgdOK2WO2ORAEqBSyRkt-fOgSD8"
          CODE=$(curl -sS -o /dev/null -w "%{http_code}" \
            "https://anbhgvgkxwofdmbhevbl.supabase.co/rest/v1/contact_submissions?select=id&limit=1" \
            -H "apikey: $ANON" \
            -H "Authorization: Bearer $ANON")
          echo "Supabase responded with HTTP $CODE"
          # Any response (200/401/403) means the project is awake; only network failure is an error.
          if [ -z "$CODE" ] || [ "$CODE" = "000" ]; then
            echo "No response from Supabase" && exit 1
          fi
